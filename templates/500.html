{% extends 'base.html' %}

{% block title %}Server Error (500) - UniWork{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 5rem;"></i>
            <h1 class="display-4 fw-bold mt-3">500</h1>
            <h3 class="mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">An unexpected condition occurred while processing your request. Please try again later or contact system administration.</p>
            <a href="{% url 'core:home' %}" class="btn btn-primary px-4 rounded-pill">
                <i class="bi bi-house-door-fill me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
