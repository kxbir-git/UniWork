{% extends 'base.html' %}

{% block title %}Page Not Found (404) - UniWork{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <i class="bi bi-compass text-muted" style="font-size: 5rem;"></i>
            <h1 class="display-4 fw-bold mt-3">404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">The page or resource you are looking for may have been moved, deleted, or does not exist.</p>
            <a href="{% url 'core:home' %}" class="btn btn-primary px-4 rounded-pill">
                <i class="bi bi-house-door-fill me-1"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
